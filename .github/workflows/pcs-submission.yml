name: PCS submission verification
on:
  pull_request:
    branches: [main]
    paths:
      - 'contributions/pcs-submissions/**'
permissions:
  contents: read
jobs:
  verify:
    # Never consume GitHub-hosted minutes; Cloudflare Builds is primary CI.
    # Enable only after a private Linux x64 runner labeled pcs-ci is registered.
    if: ${{ github.event.repository.private == true && github.ref_protected == true && github.event_name != 'pull_request' && vars.PCS_SELF_HOSTED_CI_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    name: PCS Submission Verification
    runs-on: [self-hosted, linux, x64, pcs-ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - name: Verify artifact integrity and declared file digests
        run: python scripts/check_contribution_bundle.py
      - name: Check submitted JavaScript syntax without running untrusted scripts
        run: |
          find contributions/pcs-submissions -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
      - name: Check submitted Python syntax without running untrusted scripts
        run: |
          find contributions/pcs-submissions -type f -name '*.py' -print0 | xargs -0 -r -n1 python -m py_compile
      - name: Validate PCS site routes and security contract
        run: |
          python scripts/check_site.py
          python scripts/security_campaign.py
      - name: Explain assurance limit
        run: |
          echo 'This checks contribution manifests, syntax and website regressions, not a production deployment.'
