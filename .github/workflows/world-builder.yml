name: PCS Visual World Builder
on:
  pull_request:
    paths:
      - 'public/world-builder*'
      - 'public/search-*.mjs'
      - 'research/search-quality-v1/**'
      - 'scripts/*search*'
      - 'src/worker.js'
      - 'tests/search-quality.test.mjs'
      - 'public/countermodel-*.mjs'
      - 'public/arena.html'
      - 'public/experience.html'
      - 'scripts/*world_builder*'
      - 'tests/world-builder.test.mjs'
      - 'scripts/world_builder_boundary.py'
      - 'scripts/test_world_builder_boundary.py'
      - 'scripts/check_site.py'
      - 'package*.json'
      - '.github/workflows/world-builder.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: world-builder-${{ github.ref }}
  cancel-in-progress: true
jobs:
  visual-game-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:world-builder && npm run test:search-quality
      - name: Actual visual play, replay and downloads at four widths
        env:
          PCS_WORLD_BUILDER_OUTPUT: ${{ runner.temp }}/world-builder
        run: |
          set -euo pipefail
          export PCS_CHROMIUM="$(command -v chromium || command -v google-chrome)"
          test -x "$PCS_CHROMIUM"
          npm run test:world-builder:browser
      - name: Compile all seven actual browser proof downloads and reject false control
        run: |
          set -euo pipefail
          source scripts/activate_lean_428.sh
          node scripts/search_quality_campaign.mjs "$RUNNER_TEMP/world-builder/search-quality"
          node scripts/verify_search_distance_lean.mjs | tee "$RUNNER_TEMP/world-builder/search-distance-lean.json"
          python3 scripts/verify_search_route.py "$RUNNER_TEMP/world-builder/coach-route.json"
          node scripts/verify_world_builder_downloads.mjs "$RUNNER_TEMP/world-builder" | tee "$RUNNER_TEMP/world-builder/lean-results.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: world-builder-evidence
          path: ${{ runner.temp }}/world-builder
          retention-days: 14
