name: Publish PCS File Checker
on:
  workflow_dispatch:
concurrency:
  group: pcs-file-checker-release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  packages:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/file-checker.yml
  publish:
    if: github.ref == 'refs/heads/main'
    needs: packages
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: pcs-files-*
          path: release-files
      - name: Publish tested archives without overwriting a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test '${{ needs.packages.result }}' = success
          test "$(git rev-parse HEAD)" = '${{ github.sha }}'
          mapfile -t packages < <(find release-files -name '*.zip' -o -name '*.sha256')
          test "${#packages[@]}" -eq 8
          version="$(cat desktop/VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="pcs-files-v$version"
          python scripts/check_file_checker_release.py release-files --commit '${{ github.sha }}' --version "$version"
          if gh api "repos/${{ github.repository }}/git/ref/tags/$tag" > /dev/null 2>&1; then
            echo 'The release tag already exists; historical tags must not be overwritten.' >&2
            exit 1
          fi
          gh api 'repos/${{ github.repository }}/git/refs' -f "ref=refs/tags/$tag" -f 'sha=${{ github.sha }}' > /dev/null
          gh release create "$tag" "${packages[@]}" --verify-tag --draft --target '${{ github.sha }}' --title "PCS File Checker $version" --notes-file desktop/RELEASE_NOTES.md
          test "$(gh api "repos/${{ github.repository }}/git/ref/tags/$tag" --jq .object.sha)" = '${{ github.sha }}'
          gh release edit "$tag" --draft=false
