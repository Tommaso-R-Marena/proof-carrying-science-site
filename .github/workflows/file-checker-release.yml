name: Publish PCS File Checker
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  packages:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/file-checker.yml
  publish:
    if: github.ref == 'refs/heads/main'
    needs: packages
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: pcs-files-*
          path: release-files
      - name: Publish tested archives without overwriting a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test '${{ needs.packages.result }}' = success
          test "$(git rev-parse HEAD)" = '${{ github.sha }}'
          mapfile -t packages < <(find release-files -name '*.zip' -o -name '*.sha256')
          test "${#packages[@]}" -eq 8
          gh release create pcs-files-v1.0.0 "${packages[@]}" --target '${{ github.sha }}' --title 'PCS File Checker 1.0.0' --notes-file desktop/RELEASE_NOTES.md
