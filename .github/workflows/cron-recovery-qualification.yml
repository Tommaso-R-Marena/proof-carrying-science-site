name: PCS Cron Recovery Qualification (proposal)
on:
  pull_request:
    branches: [main, fix/cron-independent-fail-closed-2026-11-13]
    paths:
      - 'src/cron-recovery.mjs'
      - 'src/scheduled-duties.mjs'
      - 'src/worker.js'
      - 'migrations/0026_cron_mail_outbox.sql'
      - 'tests/cron-recovery.test.mjs'
      - 'tests/scheduled-duties.test.mjs'
      - 'tests/test_cron_atomic_recovery.py'
      - 'tests/test_cron_captured_schema_recovery.py'
      - 'scripts/test_local_cron_integration.sh'
      - 'package.json'
      - '.github/workflows/cron-recovery-qualification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cron-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Exact cron unit and isolated real-SQL qualification
        run: npm run test:cron
      - name: Syntax and Wrangler local-only dry run
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          node --check src/worker.js
          node --check src/cron-recovery.mjs
          npx --no-install wrangler deploy --dry-run
      - name: Real local Worker scheduled-handler event, then injected D1 fault
        run: bash scripts/test_local_cron_integration.sh
