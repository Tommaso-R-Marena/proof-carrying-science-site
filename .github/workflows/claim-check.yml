name: PCS Claim Check page (research tool, actual Lean 4.28)

# Path-scoped checks for the ClaimCheck page. Read-only, no deployment credentials.
# Additive: it replaces no existing check and is not a protected requirement.
# Making it one is an owner decision (docs/governance/CLAIMCHECK_PROPOSALS.md).
on:
  pull_request:
    paths:
      - 'public/claim-check*'
      - 'public/claim-check/**'
      - 'public/page-help-core.mjs'
      - 'tests/claim-check-core.test.mjs'
      - 'tests/claim-check-page.test.mjs'
      - 'scripts/browser_claim_check.cjs'
      - 'scripts/check_reading_help_successor.mjs'
      - 'docs/evidence/site-clarity-v2/**'
      - 'package*.json'
      - '.github/workflows/claim-check.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: claim-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  claim-check-page:
    if: ${{ github.event.repository.private == false && github.repository == 'Tommaso-R-Marena/proof-carrying-science-site' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Read-only exact candidate checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Page arithmetic against recorded Lean results, wiring, v1.1 verdict bounds, served runner digest
        run: node --test tests/claim-check-core.test.mjs tests/claim-check-page.test.mjs
      - name: Prepared reading-help successor still matches its sources and fresh evidence (not effective)
        run: node scripts/check_reading_help_successor.mjs
      - name: Checksum-pinned Lean 4.28.0
        shell: bash
        run: |
          set -euo pipefail
          source scripts/activate_lean_428.sh
          lean --version
      - name: Real-browser journey; the browser-built proof file goes to the actual kernel through the served runner
        shell: bash
        env:
          PCS_CLAIM_CHECK_OUTPUT: ${{ runner.temp }}/claim-check
        run: |
          set -euo pipefail
          export PCS_CHROMIUM="$(command -v chromium || command -v google-chrome)"
          test -x "$PCS_CHROMIUM"
          "$PCS_CHROMIUM" --version
          export PCS_LEAN="$(command -v lean)"
          mkdir -p "$PCS_CLAIM_CHECK_OUTPUT"
          node scripts/browser_claim_check.cjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: claim-check-browser
          path: ${{ runner.temp }}/claim-check
          retention-days: 14
          if-no-files-found: ignore
