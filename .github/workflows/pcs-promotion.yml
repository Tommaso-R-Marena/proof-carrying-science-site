name: PCS production promotion verification
on:
  pull_request:
    branches: [main]
    paths:
      - 'contributions/pcs-promotions/**'
permissions:
  contents: read
jobs:
  promotion:
    # Never consume GitHub-hosted minutes; Cloudflare Builds is primary CI.
    # Enable only after a private Linux x64 runner labeled pcs-ci is registered.
    if: ${{ github.event.repository.private == true && github.ref_protected == true && github.event_name != 'pull_request' && vars.PCS_SELF_HOSTED_CI_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    name: PCS Promotion Verification
    runs-on: [self-hosted, linux, x64, pcs-ci]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - name: Check archive-to-production exact bytes and file scope
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/check_promotion_bundle.py
      - name: Check PCS site source/links
        run: python scripts/check_site.py
      - name: Run adversarial site/security campaign
        run: python scripts/security_campaign.py
      - name: Check Worker and browser JavaScript syntax
        run: |
          node --check src/worker.js
          node --check src/production-promotion.js
          node --check public/admin.js
          node --check public/account.js
      - name: Run submission and production-promotion integration tests
        run: |
          npm run test:submissions
          npm run test:promotions
      - name: Interpret result scope
        run: echo 'Passing site checks does not certify a deployed site or real-world scientific correctness.'
