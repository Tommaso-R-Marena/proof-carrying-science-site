name: PCS Site Contract

on:
  push:
    branches:
      - main
      - product/p0-p1-demo-hardening
  pull_request:

jobs:
  site-contract:
    # Never consume GitHub-hosted minutes; Cloudflare Builds is primary CI.
    # Enable only after a private Linux x64 runner labeled pcs-ci is registered.
    if: ${{ vars.PCS_SELF_HOSTED_CI_ENABLED == 'true' }}
    runs-on: [self-hosted, linux, x64, pcs-ci]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate static site contracts
        run: python scripts/check_site.py
