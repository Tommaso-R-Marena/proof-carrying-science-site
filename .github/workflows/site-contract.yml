name: PCS Site Contract

on:
  push:
    branches:
      - main
      - product/p0-p1-demo-hardening
  pull_request:

jobs:
  site-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate static site contracts
        run: python scripts/check_site.py
