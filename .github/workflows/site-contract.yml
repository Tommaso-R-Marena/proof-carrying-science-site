name: PCS Site Contract

on:
  push:
    branches:
      - main
      - product/p0-p1-demo-hardening
  pull_request:

permissions:
  contents: read

jobs:
  site-contract:
    # Supplemental public checks; site-full-gate remains the protected requirement.
    if: ${{ github.repository_owner == 'Tommaso-R-Marena' && github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Validate static site contracts
        run: python scripts/check_site.py
