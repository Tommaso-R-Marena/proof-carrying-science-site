name: PCS release readiness - authenticated exact SHA
on:
  workflow_dispatch:
permissions:
  contents: read
  checks: read
jobs:
  review-gate:
    if: ${{ github.event.repository.private == true && github.ref_protected == true && github.event_name != 'pull_request' && vars.PCS_SELF_HOSTED_CI_ENABLED == 'true' }}
    runs-on: [self-hosted, linux, x64, pcs-ci]
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Confirm exact checked SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.23.3"
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.14"
      - name: Install fixed-version Wrangler without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Full static, Worker and Arena security checks plus Wrangler dry-run
        run: npm run ci:zero-minutes
      - name: Verify required checks using authenticated GitHub API
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PCS_RELEASE_SHA: ${{ github.sha }}
        run: node scripts/verify_live_release_checks.mjs
