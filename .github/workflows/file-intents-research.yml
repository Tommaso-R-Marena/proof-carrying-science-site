name: Numeric intents and exact conversions
on:
  pull_request:
    paths: ['chaos-theory/scripts/file-intent/**', 'chaos-theory/formal/FileIntent*.lean', 'chaos-theory/formal/FileConversion*.lean', 'chaos-theory/scripts/conversion-gate/**', 'chaos-theory/tests/file-intent.test.ts', 'chaos-theory/evidence/file-intents-v1/**', '.github/workflows/file-intents-research.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: file-intents-research-${{ github.ref }}
  cancel-in-progress: true
jobs:
  numeric-intents-lean-and-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: chaos-theory
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: chaos-theory/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: npm ci --no-audit --no-fund
      - name: Strict profile, preserved evidence and negative controls
        run: |
          set -euo pipefail
          npm run typecheck
          npm run lint
          npm run format:check
          npx --no-install vitest run tests/file-intent.test.ts
          python3 -m unittest discover -s scripts/file-intent -p 'test_*.py' -v
      - name: Actual source-built Lean compiler and physical CSV controls
        shell: bash
        run: |
          set -euo pipefail
          source ../scripts/activate_lean_428.sh
          mkdir -p results
          npx --no-install tsx scripts/file-intent/test-native.ts | tee results/intent-native.json
          python3 scripts/file-intent/demo.py results/intent-authored-demo > results/intent-authored-demo.json
      - name: Fresh native replay and byte-identical frozen report
        shell: bash
        run: |
          set -euo pipefail
          source ../scripts/activate_lean_428.sh
          python3 scripts/file-intent/replay.py evidence/file-intents-v1/live | tee results/intent-python-replay.json
          npx --no-install tsx scripts/file-intent/native-replay.ts | tee results/intent-native-replay.json
          python3 scripts/file-intent/report.py evidence/file-intents-v1/live --output results/intent-report.md
          cmp results/intent-report.md evidence/file-intents-v1/REPORT.md
      - name: Exact-answer refinement, actual data and retained-job attacks
        shell: bash
        run: |
          set -euo pipefail
          source ../scripts/activate_lean_428.sh
          npx --no-install tsx scripts/conversion-gate/test-parser.ts | tee results/conversion-parser.json
          npx --no-install tsx scripts/conversion-gate/campaign.ts evidence/file-intents-v1/live | tee results/conversion-campaign.json
          python3 scripts/conversion-gate/verify-artifacts.py --summary results/conversion-campaign.json --study evidence/file-intents-v1/live > results/conversion-python.json
          python3 scripts/conversion-gate/verify-artifacts.py evidence/file-intents-v1/conversion-artifacts --study evidence/file-intents-v1/live > results/conversion-saved-python.json
          printf 'id,value\nsample,7\nreference,42\n' > results/conversion-input.csv
          npx --no-install tsx scripts/conversion-gate/cli.ts init results/conversion-cli results/conversion-input.csv measurements sample 1000 > results/conversion-receipt0.json
          npx --no-install tsx scripts/conversion-gate/cli.ts convert results/conversion-cli results/conversion-receipt0.json > results/conversion-receipt1.json
          npx --no-install tsx scripts/conversion-gate/cli.ts show results/conversion-cli results/conversion-receipt1.json > results/conversion-final.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: numeric-intents-${{ github.sha }}
          path: |
            chaos-theory/results/intent-*
            chaos-theory/results/conversion-*
          retention-days: 14
