name: PCS First Investigation
on:
  pull_request:
    paths:
      - 'public/first-investigation*'
      - 'public/experience*'
      - 'public/*.html'
      - 'public/styles.css'
      - 'public/site.js'
      - 'public/countermodel-core.mjs'
      - 'public/omega-core.mjs'
      - 'scripts/browser_first_investigation.cjs'
      - 'scripts/browser_beginner_journey.cjs'
      - 'scripts/check_public_copy.py'
      - 'tests/first-investigation.test.mjs'
      - 'tests/test_public_copy.py'
      - 'package*.json'
      - '.github/workflows/first-investigation.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: first-investigation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  beginner-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test tests/first-investigation.test.mjs tests/arena-experience.test.mjs
      - run: npm run test:copy
      - name: Actual four-width beginner journey, local files, downloads and stale-read attacks
        env:
          PCS_FIRST_EVIDENCE_DIR: ${{ runner.temp }}/first-investigation
        shell: bash
        run: |
          set -euo pipefail
          export PCS_CHROMIUM="$(command -v chromium || command -v google-chrome)"
          test -x "$PCS_CHROMIUM"
          "$PCS_CHROMIUM" --version
          npm run test:first-investigation:browser
          PCS_BEGINNER_OUTPUT="$PCS_FIRST_EVIDENCE_DIR/beginner-journeys" npm run test:browser:beginner
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: first-investigation-browser
          path: ${{ runner.temp }}/first-investigation
          retention-days: 14
