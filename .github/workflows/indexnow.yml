name: Notify IndexNow

on:
  workflow_run:
    workflows: ["PCS website integrity gate"]
    types: [completed]

permissions:
  contents: read

jobs:
  submit-indexnow:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for deployed ownership key
        shell: bash
        run: |
          set -euo pipefail
          KEY_URL="https://proof-carrying-science-site.marenatommaso.workers.dev/4a8be5e8bd83709358d1e1ab56e3196c.txt"
          for attempt in {1..12}; do
            if test "$(curl -fsSL "$KEY_URL")" = "4a8be5e8bd83709358d1e1ab56e3196c"; then
              exit 0
            fi
            sleep 10
          done
          echo "IndexNow ownership key did not become available after the successful main gate." >&2
          exit 1

      - name: Submit public PCS URLs to IndexNow
        shell: bash
        run: |
          set -euo pipefail
          cat > indexnow.json <<'JSON'
          {
            "host": "proof-carrying-science-site.marenatommaso.workers.dev",
            "key": "4a8be5e8bd83709358d1e1ab56e3196c",
            "keyLocation": "https://proof-carrying-science-site.marenatommaso.workers.dev/4a8be5e8bd83709358d1e1ab56e3196c.txt",
            "urlList": [
              "https://proof-carrying-science-site.marenatommaso.workers.dev/",
              "https://proof-carrying-science-site.marenatommaso.workers.dev/guided-submission.html",
              "https://proof-carrying-science-site.marenatommaso.workers.dev/package-inspector.html",
              "https://proof-carrying-science-site.marenatommaso.workers.dev/result-anatomy.html",
              "https://proof-carrying-science-site.marenatommaso.workers.dev/validation.html",
              "https://proof-carrying-science-site.marenatommaso.workers.dev/validation-registry.html",
              "https://proof-carrying-science-site.marenatommaso.workers.dev/trust.html",
              "https://proof-carrying-science-site.marenatommaso.workers.dev/trust-explorer.html",
              "https://proof-carrying-science-site.marenatommaso.workers.dev/architecture.html",
              "https://proof-carrying-science-site.marenatommaso.workers.dev/mvp.html",
              "https://proof-carrying-science-site.marenatommaso.workers.dev/contact.html"
            ]
          }
          JSON
          code="$(curl -sS -o response.txt -w '%{http_code}'             -H 'Content-Type: application/json; charset=utf-8'             --data-binary @indexnow.json             https://api.indexnow.org/indexnow)"
          cat response.txt || true
          case "$code" in
            200|202) echo "IndexNow accepted the URL batch with HTTP $code." ;;
            *) echo "IndexNow rejected the URL batch with HTTP $code." >&2; exit 1 ;;
          esac
