name: PCS Source Successor Review (non-authoritative)
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/source_successor_review.py'
      - 'tests/test_source_successor_review.py'
      - '.github/workflows/source-successor-review.yml'
      - 'docs/SOURCE_SUCCESSOR_REVIEW_DOSSIER_V1.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-source-dossier:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Fail-closed real Git fixture controls
        run: python3 -m unittest discover -s tests -p 'test_source_successor_review.py' -v
      - name: Exact-source review dossier, no admission authority
        run: |
          set -euo pipefail
          python3 scripts/source_successor_review.py \
            --repo . \
            --baseline e8136625c463b271364b36b2b8ae76f8777f1967 \
            --candidate "$(git rev-parse HEAD)" \
            --output "$RUNNER_TEMP/pcs-source-successor-review.json"
          python3 - <<'PY'
          import json,os,sys
          sys.path.insert(0,'scripts')
          from source_successor_review import validate_dossier
          path=os.path.join(os.environ['RUNNER_TEMP'],'pcs-source-successor-review.json')
          record=json.load(open(path))
          assert validate_dossier(record)
          assert record['qualified'] is False
          assert record['owner_approved'] is False
          assert record['is_release_authorization'] is False
          print('NON-AUTHORITATIVE REVIEW DOSSIER:',record['dossier_sha256'])
          print('Changed source files:',record['change_count'])
          print('Explicit review classes:',record['review_classes'])
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: non-authoritative-source-review
          path: "${{ runner.temp }}/pcs-source-successor-review.json"
          retention-days: 7

      - name: Produce exact pinned draft candidate source reviews
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pcs-source-review-candidates"
          while read -r pr exact_sha; do
            git fetch --no-tags origin "refs/pull/${pr}/head:refs/heads/pcs-review-${pr}"
            actual="$(git rev-parse "refs/heads/pcs-review-${pr}")"
            if [ "$actual" != "$exact_sha" ]; then
              echo "Candidate PR $pr moved: review needs an exact new SHA" >&2
              exit 1
            fi
            python3 scripts/source_successor_review.py \
              --repo . \
              --baseline e8136625c463b271364b36b2b8ae76f8777f1967 \
              --candidate "$actual" \
              --output "$RUNNER_TEMP/pcs-source-review-candidates/pr-${pr}.json"
          done <<'REVIEWED_SHA_LOCK'
          151 0e084e716af21483d93f620bb88af1f10b2cf9ad
          152 b5442809abeeeb81eb000277adfc6669f1de0550
          153 914dd444c5c339da4ceba00a5185222009221c01
          REVIEWED_SHA_LOCK
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: non-authoritative-candidate-review-pr-151-152-153
          path: "${{ runner.temp }}/pcs-source-review-candidates/*.json"
          retention-days: 7
