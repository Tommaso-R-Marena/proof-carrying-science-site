name: PCS Public Site Verification
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pcs-public-site-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  site-full-gate:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Bind contribution file gates to protected site verification
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/check_pr_contributions.py
      - name: Adversarial contribution gate histories
        run: python tests/test_pr_contribution_gate.py
      - name: Frozen dependencies and complete website gate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.sha }}'
          npm ci --ignore-scripts --no-audit --no-fund
          npm run ci:zero-minutes
          npm audit --audit-level=high
      - name: Check out pinned independent PCS witness checker
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Tommaso-R-Marena/proof-carrying-science
          ref: a68b5c85a2d5fbb7521df670adc99ad4fbae0f66
          path: .ci-components/pcs
          persist-credentials: false
      - name: Cross-check game semantics with the independent Python core
        run: node scripts/verify_countermodel_python.mjs --core .ci-components/pcs | tee countermodel-python-results.log
      - name: Independently replay complete player trajectories and assistance
        run: |
          set -euo pipefail
          node scripts/verify_countermodel_replay_python.mjs --core .ci-components/pcs | tee countermodel-replay-results.log
      - name: Independent Omega Boolean, graph-feature and learned-search parity
        run: |
          set -euo pipefail
          node scripts/verify_omega_python.mjs --core .ci-components/pcs | tee omega-python-results.log
      - name: Independently check all seven Lean countermodels
        run: |
          set -euo pipefail
          source scripts/activate_lean_428.sh
          node scripts/verify_countermodel_lean.mjs | tee countermodel-lean-results.log
          test "$(grep -c '^LEAN_KERNEL_VERIFIED' countermodel-lean-results.log)" -eq 7
      - name: Isolated real-browser account, authority and mobile checks
        run: |
          set -euo pipefail
          export WRANGLER_SEND_METRICS=false
          export PCS_CHROMIUM="$(command -v chromium || command -v google-chrome)"
          export PCS_BROWSER_BASE_URL=http://127.0.0.1:8788
          export PCS_BROWSER_OUTPUT="$PWD/browser-results.json"
          python - <<'PY'
          import os, pathlib, secrets
          p = pathlib.Path(os.environ['RUNNER_TEMP']) / 'local-worker.env'
          p.write_text('RATE_LIMIT_SALT=' + secrets.token_hex(32) + '\n')
          p.chmod(0o600)
          PY
          npx --no-install wrangler d1 migrations apply pcs-commons --local --persist-to "$RUNNER_TEMP/site-state"
          npx --no-install wrangler dev --local --ip 127.0.0.1 --port 8788 --persist-to "$RUNNER_TEMP/site-state" --env-file "$RUNNER_TEMP/local-worker.env" --var PUBLIC_ORIGIN:http://127.0.0.1:8788 > "$RUNNER_TEMP/local-worker.log" 2>&1 &
          site_worker_pid=$!
          trap 'kill "$site_worker_pid" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time, urllib.request
          for attempt in range(30):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8788/api/me', timeout=2) as r:
                      assert r.status == 200
                  break
              except (OSError, AssertionError):
                  time.sleep(1)
          else:
              raise SystemExit('isolated Worker did not become ready')
          PY
          npm run test:browser
          PCS_LEARNING_OUTPUT="$PWD/browser-learning-results.json" npm run test:browser:learning
          source scripts/activate_lean_428.sh
          node scripts/verify_learning_downloads.mjs --core .ci-components/pcs --input browser-learning-results.json | tee learning-download-results.log
          PCS_RESEARCH_DB_STATE="$RUNNER_TEMP/site-state" PCS_RESEARCH_OUTPUT="$PWD/browser-research-results.json" npm run test:browser:research
          python scripts/security_campaign.py --static --base-url http://127.0.0.1:8788
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: public-site-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            countermodel-python-results.log
            countermodel-replay-results.log
            countermodel-lean-results.log
            browser-results.json
            browser-results.json.omega-*
            browser-research-results.json
            browser-learning-results.json
            browser-learning-results.json.model-*.json
            browser-learning-results.json.trace-*.json
            browser-learning-results.json.witness-*.lean
            learning-download-results.log
            omega-python-results.log
          retention-days: 14
