name: PCS Public Site Verification
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pcs-public-site-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  site-full-gate:
    needs: lean-learning-browser
    if: ${{ always() && github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Bind contribution file gates to protected site verification
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/check_pr_contributions.py
      - name: Adversarial contribution gate histories
        run: python tests/test_pr_contribution_gate.py
      - name: Require actual Lean browser execution
        env:
          LEAN_BROWSER_RESULT: ${{ needs.lean-learning-browser.result }}
        run: test "$LEAN_BROWSER_RESULT" = success
      - name: Frozen dependencies and complete website gate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.sha }}'
          npm ci --ignore-scripts --no-audit --no-fund
          bash scripts/cloudflare_build.sh
          npm audit --audit-level=high
      - name: Check out pinned independent PCS witness checker
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Tommaso-R-Marena/proof-carrying-science
          ref: d4bffe22949b7c9a3c16787dbc7e106d7679e82e
          path: .ci-components/pcs
          persist-credentials: false
      - name: Cross-check game semantics with the independent Python core
        run: node scripts/verify_countermodel_python.mjs --core .ci-components/pcs | tee countermodel-python-results.log
      - name: Independently replay complete player trajectories and assistance
        run: |
          set -euo pipefail
          node scripts/verify_countermodel_replay_python.mjs --core .ci-components/pcs | tee countermodel-replay-results.log
      - name: Independent Omega Boolean, graph-feature and learned-search parity
        run: |
          set -euo pipefail
          node scripts/verify_omega_python.mjs --core .ci-components/pcs | tee omega-python-results.log
          node scripts/verify_adaptive_python.mjs --core .ci-components/pcs | tee omega-adaptive-python-results.log
      - name: Independent assumption-aware diagrams, conflicts and work limits
        run: node scripts/verify_conditional_python.mjs --core .ci-components/pcs | tee conditional-python-parity-results.json
      - name: Independent optimal interventions, counts, explanations and proposal gaps
        run: node scripts/verify_intervention_python.mjs --core .ci-components/pcs | tee intervention-python-parity-results.json
      - name: Independently check all seven Lean countermodels
        run: |
          set -euo pipefail
          source scripts/activate_lean_428.sh
          node scripts/verify_countermodel_lean.mjs | tee countermodel-lean-results.log
          test "$(grep -c '^LEAN_KERNEL_VERIFIED' countermodel-lean-results.log)" -eq 7
      - name: Build and exhaustively compare the proved general finite evaluator
        run: |
          set -euo pipefail
          source scripts/activate_lean_428.sh
          python3 .ci-components/pcs/scripts/generate_countermodel_missions.py
          python3 .ci-components/pcs/scripts/audit_lean_source.py .ci-components/pcs/formal/PCSCountermodel.lean .ci-components/pcs/formal/PCSCountermodel .ci-components/pcs/formal/PCSCountermodelReplay.lean
          (cd .ci-components/pcs/formal && lake build PCSCountermodel pcs-countermodel-replay)
          python3 .ci-components/pcs/scripts/verify_countermodel_formal.py | tee countermodel-formal-python-results.log
          node scripts/verify_countermodel_formal.mjs --core .ci-components/pcs | tee countermodel-formal-javascript-results.log
      - name: Isolated real-browser account, authority and mobile checks
        run: |
          set -euo pipefail
          export WRANGLER_SEND_METRICS=false
          export PCS_CHROMIUM="$(command -v chromium || command -v google-chrome)"
          export PCS_BROWSER_BASE_URL=http://127.0.0.1:8788
          export PCS_BROWSER_OUTPUT="$PWD/browser-results.json"
          python - <<'PY'
          import os, pathlib, secrets
          p = pathlib.Path(os.environ['RUNNER_TEMP']) / 'local-worker.env'
          p.write_text('RATE_LIMIT_SALT=' + secrets.token_hex(32) + '\n')
          p.chmod(0o600)
          PY
          npx --no-install wrangler d1 migrations apply pcs-commons --local --persist-to "$RUNNER_TEMP/site-state"
          npx --no-install wrangler dev --local --ip 127.0.0.1 --port 8788 --persist-to "$RUNNER_TEMP/site-state" --env-file "$RUNNER_TEMP/local-worker.env" --var PUBLIC_ORIGIN:http://127.0.0.1:8788 > "$RUNNER_TEMP/local-worker.log" 2>&1 &
          site_worker_pid=$!
          trap 'kill "$site_worker_pid" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time, urllib.request
          for attempt in range(30):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8788/api/me', timeout=2) as r:
                      assert r.status == 200
                  break
              except (OSError, AssertionError):
                  time.sleep(1)
          else:
              raise SystemExit('isolated Worker did not become ready')
          PY
          npm run test:browser
          PCS_USABILITY_OUTPUT="$PWD/browser-usability-results.json" npm run test:browser:usability
          PCS_LAYOUT_OUTPUT="$PWD/browser-layout-results" npm run test:browser:layout
          PYTHONPATH="$PWD/.ci-components/pcs" python - <<'PYREPLAY'
          import json, pathlib
          from pcs.experimental.conditional import verify
          receipts = sorted(pathlib.Path('browser-layout-results').glob('conditional-*.json'))
          assert len(receipts) == 6
          for path in receipts:
              assert path.stat().st_size <= 262144
              print(path.name, verify(json.loads(path.read_text())))
          from pcs.experimental.intervention import verify as verify_plan
          plans = sorted(pathlib.Path('browser-layout-results').glob('intervention-*.json'))
          assert len(plans) == 4
          for path in plans:
              assert path.stat().st_size <= 1048576
              assert verify_plan(json.loads(path.read_text())) == 'optimal_plan'
              print(path.name, 'independently verified optimal plan')
          from pcs.countermodel_v1 import replay_countermodel_session
          traces = sorted(pathlib.Path('.').glob('browser-usability-results.json.trace-*.json'))
          assert len(traces) == 4
          for path in traces:
              trace = json.loads(path.read_text())
              replay = replay_countermodel_session({key: trace[key] for key in ['version', 'mission_id', 'actions']})
              assert replay['final_verified'] and replay['final_world']['n'] == 2
              assert replay['final_world']['R'][1][1]
              print(path.name, 'independently replayed undo and relationship edits')
          PYREPLAY
          PCS_LEARNING_OUTPUT="$PWD/browser-learning-results.json" npm run test:browser:learning
          source scripts/activate_lean_428.sh
          node scripts/verify_learning_downloads.mjs --core .ci-components/pcs --input browser-learning-results.json | tee learning-download-results.log
          PCS_RESEARCH_DB_STATE="$RUNNER_TEMP/site-state" PCS_RESEARCH_OUTPUT="$PWD/browser-research-results.json" npm run test:browser:research
          python scripts/security_campaign.py --static --base-url http://127.0.0.1:8788
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: public-site-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            countermodel-python-results.log
            countermodel-replay-results.log
            countermodel-lean-results.log
            countermodel-formal-python-results.log
            countermodel-formal-javascript-results.log
            browser-results.json
            browser-usability-results.json*
            browser-layout-results/
            conditional-python-parity-results.json
            intervention-python-parity-results.json
            omega-adaptive-python-results.log
            browser-results.json.omega-*
            browser-research-results.json
            browser-learning-results.json
            browser-learning-results.json.model-*.json
            browser-learning-results.json.trace-*.json
            browser-learning-results.json.witness-*.lean
            learning-download-results.log
            omega-python-results.log
          retention-days: 14

  lean-learning-browser:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Tommaso-R-Marena/proof-carrying-science
          ref: e0c4f7b3af37f1ae42eb5f4cbee8937f9dc93604
          path: .ci-components/lean-prover
          persist-credentials: false
      - name: Pinned CPU backend and actual four-width proof play
        shell: bash
        run: |
          set -euo pipefail
          export WRANGLER_SEND_METRICS=false
          npm ci --ignore-scripts --no-audit --no-fund
          npm run test:lean-research
          source .ci-components/lean-prover/scripts/activate_lean_428.sh
          python -m pip install --require-hashes -r .ci-components/lean-prover/requirements-build.lock -r .ci-components/lean-prover/requirements-dev.lock -r .ci-components/lean-prover/requirements-prover.lock
          python -m pip install --no-deps --no-build-isolation -e .ci-components/lean-prover
          export PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH="$(command -v chromium || command -v google-chrome)"
          python -m pcs.experimental.prover.server --models .ci-components/lean-prover/research/lean-learning-v2 --public public > "$RUNNER_TEMP/lean-lab.log" 2>&1 &
          lean_lab_pid=$!
          trap 'kill "$lean_lab_pid" 2>/dev/null || true' EXIT
          python - <<'PYWAIT'
          import time, urllib.request
          for attempt in range(60):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8766/api/health',timeout=2) as r:
                      assert r.status == 200
                  break
              except (OSError, AssertionError): time.sleep(1)
          else: raise SystemExit('Real Lean backend did not start')
          PYWAIT
          PCS_LEAN_CORE="$PWD/.ci-components/lean-prover" node scripts/browser_lean_learning.cjs
      # Exact proof receipts are in logs; no extra artifact storage is allocated.
