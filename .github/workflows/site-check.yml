name: PCS website integrity gate

on:
  push:
    branches:
      - main
      - v06-mvp-product
      - ux/guided-submission-v1
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  site-check:
    # Never consume GitHub-hosted minutes; Cloudflare Builds is primary CI.
    # Enable only after a private Linux x64 runner labeled pcs-ci is registered.
    if: ${{ vars.PCS_SELF_HOSTED_CI_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, linux, x64, pcs-ci]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate JavaScript syntax
        run: |
          node --check notify-indexnow.mjs
          node --check public/site.js
          node --check public/commons.js
          node --check public/roles.js
          node --check public/task-graph.js
          node --check public/arena.js
          node --check public/account.js
          node --check public/admin-login.js
          node --check public/admin.js
          node --check src/worker.js
          node --check src/contribution-github.js
          node --check src/production-promotion.js
          node --check public/research-preview-engine.mjs
          node --check public/research-preview.js
          node --check public/researcher-pilot-core.mjs
          node --check public/researcher-pilot-ui.js
          node --check public/proof-order-core.mjs
          node --check public/arena-proof-quest.js
          node --check scripts/prepare_proof_quest_dataset.mjs
          node --check public/safety-forge-core.mjs
          node --check public/arena-safety-forge.js
          node --check scripts/prepare_safety_forge_dataset.mjs
          node --check scripts/benchmark_safety_forge.mjs
          node --check public/project-builder.js
          node --check public/guided-submission.js
          node --check public/result-anatomy.js
          node --check public/demo.js
          node --check public/package-inspector.js
          node --check public/trust-explorer.js
          node --check public/validation-registry.js
      - name: Run Commons submission and production promotion security regressions
        run: |
          npm run test:submissions
          npm run test:promotions
          npm run test:preview
          npm run test:pilots
          npm run test:quest
          npm run test:arena:onboarding
          npm run test:catalog
          npm run test:quest:dataset
          npm run test:safety:forge
          node --check tests/safety-forge-worker.test.mjs
          npm run test:safety:benchmark
      - name: Validate deployable static site
        run: python scripts/check_site.py
      - name: Run defensive security campaign
        run: python scripts/security_campaign.py --static
      - name: Enforce zero-billing Cloudflare posture
        run: python scripts/check_free_infrastructure.py
      - name: Install pinned Wrangler
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate Cloudflare deployment configuration
        run: npm run deploy:dry-run
