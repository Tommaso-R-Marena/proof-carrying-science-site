name: PCS website integrity gate

on:
  push:
    branches:
      - main
      - v06-mvp-product
      - ux/guided-submission-v1
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate JavaScript syntax
        run: |
          node --check public/site.js
          node --check public/project-builder.js
          node --check public/guided-submission.js
          node --check public/result-anatomy.js
          node --check public/demo.js
      - name: Validate deployable static site
        run: python scripts/check_site.py
