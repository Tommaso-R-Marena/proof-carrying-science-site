name: PCS website integrity gate

on:
  push:
    branches:
      - main
      - v06-mvp-product
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate deployable static site
        run: python scripts/check_site.py
