name: PCS live production health

on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pcs-live-production-health
  cancel-in-progress: true

jobs:
  live-health:
    # Read-only production requests from public main; no deployment credentials.
    if: ${{ github.repository_owner == 'Tommaso-R-Marena' && github.event.repository.private == false && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.14"
      - name: Check production site
        run: python scripts/check_live_site.py
