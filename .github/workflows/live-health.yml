name: PCS live production health

on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/check_live_site.py"
      - ".github/workflows/live-health.yml"

permissions:
  contents: read

concurrency:
  group: pcs-live-production-health
  cancel-in-progress: true

jobs:
  live-health:
    # Never consume GitHub-hosted minutes; Cloudflare Builds is primary CI.
    # Enable only after a private Linux x64 runner labeled pcs-ci is registered.
    if: ${{ github.event.repository.private == true && github.ref_protected == true && github.event_name != 'pull_request' && vars.PCS_SELF_HOSTED_CI_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, linux, x64, pcs-ci]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.14"
      - name: Check production site
        run: python scripts/check_live_site.py
