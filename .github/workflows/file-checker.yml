name: PCS Portable File Checker
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pcs-files-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  packages:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-2022, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Tommaso-R-Marena/proof-carrying-science
          ref: f20f3cab2938f2e085f137185e88f4700d5da2ed
          path: .ci-components/file-check-core
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.17'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - name: Official hash-pinned Lean toolchain and packaging dependencies
        shell: bash
        run: |
          python scripts/install_file_checker_lean.py
          python -m pip install --require-hashes -r desktop/requirements-build.lock
      - name: Browser/Python semantics and malformed input tests
        shell: bash
        run: |
          node --test tests/file-check.test.mjs tests/change-review.test.mjs
          python -m unittest discover -s tests -p test_file_checker.py -v
          python -m unittest discover -s tests -p test_change_review.py -v
          python -m unittest discover -s tests -p test_usability_sessions.py -v
          python -m unittest discover -s tests -p test_git_snapshot.py -v
          python scripts/file_check_differential.py
      - name: Build actual native checker, audit theorem dependencies and package app
        run: python scripts/build_file_checker.py --core .ci-components/file-check-core --output "${{ runner.temp }}/pcs-files-build" --package
      - name: Real Lean authorization and local request boundary
        shell: bash
        run: |
          python scripts/test_file_checker_native.py "${{ runner.temp }}/pcs-files-build/bundle"
          python scripts/test_change_review_boundary.py "${{ runner.temp }}/pcs-files-build/bundle"
      - name: Original byte grammar and conservation policy differentials
        shell: bash
        run: |
          binary='${{ runner.temp }}/pcs-files-build/bundle/pcs-files-checker'
          if [ '${{ runner.os }}' = Windows ]; then binary="$binary.exe"; fi
          python scripts/test_original_csv_native.py "$binary"
          python scripts/test_change_review_native.py "$binary"
      - name: Real published-data conservation and labeled corruption controls
        run: python scripts/run_public_export_experiment.py "${{ runner.temp }}/pcs-files-build/bundle" > "${{ runner.temp }}/pcs-files-build/public-data-experiment.json"
      - name: Linux browser task completion including real local Lean confirmation
        if: runner.os == 'Linux'
        env:
          PCS_FILE_CHECK_BUNDLE: ${{ runner.temp }}/pcs-files-build/bundle
          PCS_FILE_CHECK_EXECUTABLE: ${{ runner.temp }}/pcs-files-build/dist/PCS File Checker
          PCS_FILE_CHECK_BROWSER_OUTPUT: ${{ runner.temp }}/pcs-files-browser
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
          PCS_CHROMIUM="$(node -e "console.log(require('playwright').chromium.executablePath())")" node scripts/browser_file_check.cjs
          PCS_CHROMIUM="$(node -e "console.log(require('playwright').chromium.executablePath())")" node scripts/browser_change_review.cjs
          python scripts/analyze_usability_sessions.py "${{ runner.temp }}/pcs-files-browser/study-automated-session.json" > "${{ runner.temp }}/pcs-files-browser/study-analysis.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pcs-files-${{ runner.os }}-${{ runner.arch }}
          path: |
            ${{ runner.temp }}/pcs-files-build/*.zip
            ${{ runner.temp }}/pcs-files-build/*.sha256
            ${{ runner.temp }}/pcs-files-build/BUILD.json
            ${{ runner.temp }}/pcs-files-build/axioms.log
            ${{ runner.temp }}/pcs-files-browser/*.json
            ${{ runner.temp }}/pcs-files-build/public-data-experiment.json
          if-no-files-found: error

  qualify-packages:
    needs: packages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: pcs-files-*
          path: qualified-files
      - name: Require exact source closure across all four real platform archives
        run: python scripts/check_file_checker_release.py qualified-files --commit '${{ github.sha }}' --version "$(cat desktop/VERSION)"
