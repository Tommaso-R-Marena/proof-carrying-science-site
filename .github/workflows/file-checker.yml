name: PCS Portable File Checker
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pcs-files-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  packages:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-2022, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Tommaso-R-Marena/proof-carrying-science
          ref: f20f3cab2938f2e085f137185e88f4700d5da2ed
          path: .ci-components/file-check-core
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - name: Official hash-pinned Lean toolchain and packaging dependencies
        run: |
          python scripts/install_file_checker_lean.py
          python -m pip install --require-hashes -r desktop/requirements-build.lock
      - name: Browser/Python semantics and malformed input tests
        run: |
          node --test tests/file-check.test.mjs
          python -m unittest discover -s tests -p test_file_checker.py -v
          python scripts/file_check_differential.py
      - name: Build actual native checker, audit existing theorems and package app
        run: python scripts/build_file_checker.py --core .ci-components/file-check-core --output "${{ runner.temp }}/pcs-files-build" --package
      - name: Real Lean authorization and local request boundary
        run: python scripts/test_file_checker_native.py "${{ runner.temp }}/pcs-files-build/bundle"
      - name: Linux browser task completion including real local Lean confirmation
        if: runner.os == 'Linux'
        env:
          PCS_FILE_CHECK_BUNDLE: ${{ runner.temp }}/pcs-files-build/bundle
          PCS_FILE_CHECK_BROWSER_OUTPUT: ${{ runner.temp }}/pcs-files-browser
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
          PCS_CHROMIUM="$(node -e "console.log(require('playwright').chromium.executablePath())")" node scripts/browser_file_check.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pcs-files-${{ runner.os }}-${{ runner.arch }}
          path: |
            ${{ runner.temp }}/pcs-files-build/*.zip
            ${{ runner.temp }}/pcs-files-build/*.sha256
            ${{ runner.temp }}/pcs-files-build/BUILD.json
            ${{ runner.temp }}/pcs-files-build/axioms.log
            ${{ runner.temp }}/pcs-files-browser/results.json
          if-no-files-found: error
